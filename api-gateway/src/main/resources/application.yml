server:
  port: 9081

spring:
  application:
    name: API-GATEWAY
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/v1/users/**
            - id: todo-service
              uri: lb://TODO-SERVICE
              predicates:
                - Path=/api/v1/todos/**
            - id: file-service
              uri: lb://FILE-SERVICE
              predicates:
                - Path=/api/v1/files/**
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/v1/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

rate-limit:
  requests-per-window: 100
  window-seconds: 60